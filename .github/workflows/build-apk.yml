name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Daypath-v0.1.0.apk

      - name: Verify APK structure
        run: |
          test -s Daypath-v0.1.0.apk
          file Daypath-v0.1.0.apk
          unzip -t Daypath-v0.1.0.apk

      - name: Verify APK signature and package metadata
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs Daypath-v0.1.0.apk | tee apk-signature.txt
          "$AAPT" dump badging Daypath-v0.1.0.apk | tee apk-badging.txt
          grep -q "package: name='com.daypath.app' versionCode='1' versionName='0.1.0'" apk-badging.txt

      - name: Create checksum
        run: sha256sum Daypath-v0.1.0.apk > Daypath-v0.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daypath-APK
          path: |
            Daypath-v0.1.0.apk
            Daypath-v0.1.0.apk.sha256
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14
